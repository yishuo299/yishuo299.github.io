<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>清透水墨全息闪卡测试</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #eef9ff;
      --muted: rgba(238, 249, 255, .72);
      --cyan: #9eefff;
      --gold: #f2d184;
      --jade: #78d9cc;
      --bg: #071015;
    }

    * { box-sizing: border-box; }

    html,
    body {
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 18%, rgba(129, 226, 224, .22), transparent 34%),
        radial-gradient(circle at 82% 76%, rgba(242, 209, 132, .16), transparent 34%),
        linear-gradient(135deg, #061117, #0f1d25 44%, #07090e);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: radial-gradient(circle at 50% 42%, #000, transparent 72%);
      pointer-events: none;
      content: "";
    }

    .stage {
      position: relative;
      display: grid;
      min-height: 100dvh;
      padding: 28px;
      place-items: center;
      perspective: 1800px;
      isolation: isolate;
    }

    .halo {
      position: absolute;
      width: min(720px, 88vw);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255, 255, 255, .18), transparent 24%),
        conic-gradient(from 20deg, rgba(158, 239, 255, .18), rgba(242, 209, 132, .14), rgba(190, 143, 255, .16), rgba(120, 217, 204, .18), rgba(158, 239, 255, .18));
      filter: blur(22px);
      opacity: .78;
      animation: breathe 6s ease-in-out infinite;
      pointer-events: none;
    }

    .scene-depth {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      transform-style: preserve-3d;
    }

    .scene-moon {
      position: absolute;
      top: 12%;
      left: 50%;
      width: min(230px, 28vw);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 42% 34%, rgba(255, 255, 255, .96), rgba(255, 241, 197, .72) 34%, rgba(246, 204, 117, .34) 56%, transparent 68%);
      filter: blur(.2px) drop-shadow(0 0 38px rgba(242, 209, 132, .25));
      opacity: .62;
      transform: translate3d(calc(-50% + var(--scene-x, 0px) * -0.7), calc(var(--scene-y, 0px) * -0.45), -180px);
    }

    .scene-mountain {
      position: absolute;
      right: -10vw;
      bottom: -6vh;
      left: -10vw;
      height: 42vh;
      opacity: .36;
      background:
        linear-gradient(142deg, transparent 0 15%, rgba(126, 203, 205, .32) 15% 16%, transparent 17%),
        linear-gradient(28deg, transparent 0 38%, rgba(255, 255, 255, .18) 38% 39%, transparent 40%),
        linear-gradient(155deg, transparent 0 50%, rgba(58, 107, 116, .58) 51% 66%, transparent 67%),
        linear-gradient(28deg, transparent 0 25%, rgba(24, 62, 73, .74) 26% 48%, transparent 49%),
        linear-gradient(155deg, transparent 0 33%, rgba(19, 47, 61, .82) 34% 60%, transparent 61%);
      filter: blur(1px);
      transform: translate3d(calc(var(--scene-x, 0px) * -1.2), calc(var(--scene-y, 0px) * -0.55), -130px);
    }

    .card-wrap {
      position: relative;
      width: min(420px, 72vw, 62vh);
      aspect-ratio: 2 / 3;
      transform-style: preserve-3d;
    }

    .card {
      --rx: -8deg;
      --ry: 22deg;
      --shine-x: 50%;
      --shine-y: 28%;
      --depth-x: 0px;
      --depth-y: 0px;
      position: absolute;
      inset: 0;
      border: 0;
      border-radius: 28px;
      cursor: grab;
      transform:
        rotateX(var(--rx))
        rotateY(var(--ry))
        translateZ(0);
      transform-style: preserve-3d;
      transition: transform 180ms cubic-bezier(.16, 1, .3, 1), box-shadow 240ms ease;
      box-shadow:
        0 42px 95px rgba(0, 0, 0, .48),
        0 0 70px rgba(111, 224, 219, .13);
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .card.dragging {
      cursor: grabbing;
      transition: box-shadow 240ms ease;
      box-shadow:
        0 54px 120px rgba(0, 0, 0, .68),
        0 0 84px rgba(158, 239, 255, .2);
    }

    .card.auto-spin {
      animation: spinCard 1.35s cubic-bezier(.2, .82, .16, 1);
    }

    .card-face,
    .card-back,
    .card-edge,
    .bg-plane,
    .subject-plane,
    .lineart-plane,
    .foreground-plane,
    .name-layer,
    .name-shadow,
    .contact-card {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      transform-style: preserve-3d;
      pointer-events: none;
    }

    .card-edge {
      inset: -10px;
      z-index: -4;
      border: 10px solid rgba(242, 209, 132, .68);
      border-radius: 36px;
      background: transparent;
      filter: drop-shadow(0 18px 24px rgba(5, 18, 24, .42));
      transform: translateZ(-18px);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, .28),
        0 0 0 1px rgba(68, 117, 118, .46);
    }

    .card-back {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      background:
        radial-gradient(circle at 50% 18%, rgba(242, 209, 132, .22), transparent 34%),
        radial-gradient(circle at 20% 78%, rgba(120, 217, 204, .18), transparent 30%),
        linear-gradient(135deg, rgba(19, 46, 49, .98), rgba(7, 13, 19, .98));
      transform: rotateY(180deg) translateZ(16px);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .22);
    }

    .contact-card {
      inset: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 28px;
      border: 1px solid rgba(242, 209, 132, .45);
      border-radius: 24px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .02)),
        radial-gradient(circle at 50% 0%, rgba(242, 209, 132, .14), transparent 44%);
      color: rgba(255, 248, 224, .92);
      box-shadow:
        inset 0 0 42px rgba(242, 209, 132, .08),
        0 0 38px rgba(111, 224, 219, .12);
      transform: translateZ(34px);
    }

    .back-name {
      margin-bottom: 12px;
      font-family: "STKaiti", "KaiTi", "Microsoft YaHei", serif;
      font-size: clamp(40px, 8vw, 68px);
      font-weight: 700;
      letter-spacing: .2em;
      line-height: 1;
      text-indent: .2em;
    }

    .back-subtitle {
      margin-bottom: 26px;
      color: rgba(238, 249, 255, .62);
      font-size: 12px;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    .contact-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 18px;
      padding: 14px 0;
      border-top: 1px solid rgba(242, 209, 132, .22);
    }

    .contact-row:last-child {
      border-bottom: 1px solid rgba(242, 209, 132, .22);
    }

    .contact-label {
      color: rgba(158, 239, 255, .72);
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .contact-value {
      color: rgba(255, 248, 224, .96);
      font-size: clamp(17px, 3.6vw, 24px);
      font-weight: 650;
      letter-spacing: .04em;
    }

    .card-face {
      overflow: visible;
      background: transparent;
      transform: translateZ(18px);
      box-shadow: none;
    }

    .bg-plane {
      z-index: 0;
      inset: 34px 24px 22px;
      background:
        radial-gradient(circle at 58% 18%, rgba(247, 210, 116, .46), transparent 17%),
        linear-gradient(150deg, transparent 0 36%, rgba(38, 92, 111, .32) 37% 53%, transparent 54%),
        linear-gradient(28deg, transparent 0 28%, rgba(255, 255, 255, .22) 29% 30%, transparent 31%),
        url("../holo-avatar/assets/background.png");
      background-size: auto, auto, auto, cover;
      background-position: center, center, center, center;
      filter: saturate(.98) contrast(.98) brightness(1.06);
      opacity: 1;
      border-radius: 20px;
      box-shadow: 0 18px 38px rgba(22, 63, 72, .22);
      transform: translate3d(calc(var(--depth-x) * -0.76), calc(var(--depth-y) * -0.46), -18px) scale(1.16);
    }

    .subject-plane {
      z-index: 3;
      background-image: url("../holo-avatar/assets/subject.png");
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      filter:
        drop-shadow(calc(var(--depth-x) * -.34) calc(24px + var(--depth-y) * .18) 20px rgba(13, 34, 43, .5))
        saturate(1.06);
      transform: translate3d(calc(var(--depth-x) * .58), calc(var(--depth-y) * .38), 34px) scale(1.02);
    }

    .lineart-plane {
      z-index: 4;
      background-image: url("../holo-avatar/assets/lineart.png");
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      mix-blend-mode: multiply;
      opacity: .28;
      transform: translate3d(calc(var(--depth-x) * .62), calc(var(--depth-y) * .4), 40px) scale(1.021);
      filter: drop-shadow(0 0 10px rgba(255, 245, 210, .28));
    }

    .foreground-plane {
      z-index: 6;
      inset: -8% -14%;
      background:
        radial-gradient(ellipse at 22% 82%, rgba(255, 255, 255, .72), transparent 24%),
        radial-gradient(ellipse at 78% 18%, rgba(255, 255, 255, .52), transparent 20%),
        linear-gradient(112deg, transparent 22%, rgba(250, 220, 146, .45) 42%, transparent 48%),
        linear-gradient(28deg, transparent 32%, rgba(137, 245, 232, .32) 44%, transparent 60%);
      mix-blend-mode: screen;
      opacity: .64;
      transform: translate3d(calc(var(--depth-x) * .42), calc(var(--depth-y) * .24), 28px) rotate(-8deg);
    }

    .name-shadow {
      z-index: 7;
      inset: 16px 22px auto;
      height: 96px;
      border-radius: 20px;
      background:
        radial-gradient(ellipse at 50% 46%, rgba(20, 41, 45, .5), transparent 72%);
      opacity: .58;
      transform: translate3d(calc(var(--depth-x) * -.28), calc(8px + var(--depth-y) * -.16), 28px);
      filter: blur(12px);
    }

    .name-layer {
      z-index: 8;
      inset: 19px 24px auto;
      display: grid;
      min-height: 82px;
      padding: 10px 18px 12px;
      place-items: center;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #6c5020;
      text-align: center;
      text-shadow:
        0 1px 0 rgba(255, 255, 255, .8),
        0 8px 18px rgba(75, 51, 12, .2);
      box-shadow: none;
      transform: translate3d(calc(var(--depth-x) * .62), calc(var(--depth-y) * .34), 48px);
    }

    .name-layer::before,
    .name-layer::after {
      position: absolute;
      top: 50%;
      width: 38px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(108, 80, 32, .58), transparent);
      content: "";
    }

    .name-layer::before { left: 16px; }
    .name-layer::after { right: 16px; }

    .name-main {
      display: block;
      font-family: "STKaiti", "KaiTi", "Microsoft YaHei", serif;
      font-size: clamp(32px, 6.4vw, 48px);
      font-weight: 700;
      letter-spacing: .2em;
      line-height: 1;
      text-indent: .2em;
    }

    .name-sub {
      display: block;
      margin-top: 6px;
      color: rgba(76, 63, 38, .76);
      font-size: 12px;
      letter-spacing: .24em;
      text-indent: .24em;
      text-transform: uppercase;
    }

    .rim {
      position: absolute;
      inset: 10px;
      z-index: 9;
      border: 1px solid rgba(255, 255, 255, .58);
      border-radius: 22px;
      box-shadow:
        inset 0 0 0 1px rgba(242, 209, 132, .24),
        0 0 18px rgba(158, 239, 255, .22);
      transform: translateZ(34px);
      pointer-events: none;
    }

    .glint {
      position: absolute;
      z-index: 10;
      width: 10px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0 16%, rgba(242, 209, 132, .86) 17% 34%, transparent 68%);
      filter: drop-shadow(0 0 12px rgba(242, 209, 132, .66));
      transform: translateZ(44px);
      animation: twinkle 2.8s ease-in-out infinite;
      pointer-events: none;
    }

    .glint:nth-child(8) { top: 13%; left: 18%; animation-delay: -.4s; }
    .glint:nth-child(9) { top: 54%; right: 9%; width: 8px; animation-delay: -1.1s; }
    .glint:nth-child(10) { right: 20%; bottom: 12%; width: 12px; animation-delay: -1.8s; }

    .panel {
      position: fixed;
      right: 24px;
      bottom: 22px;
      left: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font-size: 13px;
      pointer-events: none;
    }

    .title {
      color: var(--ink);
      font-size: 15px;
      letter-spacing: .08em;
    }

    .hint { text-align: right; }

    @keyframes spinCard {
      from {
        transform: rotateX(var(--rx)) rotateY(var(--ry)) translateZ(0);
      }
      to {
        transform: rotateX(calc(var(--rx) + 360deg)) rotateY(calc(var(--ry) + 360deg)) translateZ(0);
      }
    }

    @keyframes twinkle {
      0%, 100% { opacity: .28; transform: translateZ(44px) scale(.72); }
      45% { opacity: 1; transform: translateZ(54px) scale(1.18); }
    }

    @keyframes breathe {
      0%, 100% { transform: scale(.94); opacity: .62; }
      50% { transform: scale(1.04); opacity: .9; }
    }

    @media (max-width: 640px) {
      .stage { padding: 18px; }
      .card-wrap { width: min(360px, 82vw, 68vh); }
      .panel {
        align-items: flex-start;
        flex-direction: column;
        font-size: 12px;
      }
      .hint { text-align: left; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }

      .card { --rx: 0deg; --ry: 0deg; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="清透水墨全息闪卡 360 度测试">
    <div class="scene-depth" aria-hidden="true">
      <div class="scene-moon"></div>
      <div class="scene-mountain"></div>
    </div>
    <div class="halo" aria-hidden="true"></div>
    <section class="card-wrap" aria-label="拖拽或点击测试闪卡旋转">
      <div class="card" id="card" role="img" aria-label="清透水墨与浅金典藏方向的全息闪卡">
        <div class="card-edge" aria-hidden="true"></div>
        <div class="card-back" aria-hidden="true">
          <div class="contact-card">
            <div class="back-name">燚燿</div>
            <div class="back-subtitle">Project Archive</div>
            <div class="contact-row"><span class="contact-label">WeChat</span><span class="contact-value">yy_shuo_299</span></div>
            <div class="contact-row"><span class="contact-label">QQ</span><span class="contact-value">3441125143</span></div>
          </div>
        </div>
        <div class="card-face">
          <div class="bg-plane" aria-hidden="true"></div>
          <div class="subject-plane" aria-hidden="true"></div>
          <div class="lineart-plane" aria-hidden="true"></div>
          <div class="foreground-plane" aria-hidden="true"></div>
          <div class="name-shadow" aria-hidden="true"></div>
          <div class="name-layer" aria-hidden="true"><span class="name-main">燚燿</span><span class="name-sub">Project Archive</span></div>
          <div class="rim" aria-hidden="true"></div>
          <i class="glint" aria-hidden="true"></i>
          <i class="glint" aria-hidden="true"></i>
          <i class="glint" aria-hidden="true"></i>
        </div>
      </div>
    </section>
    <aside class="panel" aria-hidden="true">
      <div>
        <div class="title">清透水墨 · 浅金典藏 · 360° 测试</div>
        <div>基于第一张候选卡片制作的 HTML 交互预览</div>
      </div>
      <div class="hint">拖拽旋转卡片，单击自动转一圈</div>
    </aside>
  </main>

  <script>
    const card = document.getElementById("card");
    const stage = document.querySelector(".stage");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let dragging = false;
    let moved = false;
    let startX = 0;
    let startY = 0;
    let rotateX = -8;
    let rotateY = 22;
    let baseX = rotateX;
    let baseY = rotateY;

    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

    const applyRotation = () => {
      card.style.setProperty("--rx", `${rotateX.toFixed(2)}deg`);
      card.style.setProperty("--ry", `${rotateY.toFixed(2)}deg`);
    };

    const updateShine = (event) => {
      const rect = card.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width) * 100;
      const y = ((event.clientY - rect.top) / rect.height) * 100;
      const nx = ((event.clientX - rect.left) / rect.width) - .5;
      const ny = ((event.clientY - rect.top) / rect.height) - .5;
      card.style.setProperty("--shine-x", `${clamp(x, 0, 100).toFixed(1)}%`);
      card.style.setProperty("--shine-y", `${clamp(y, 0, 100).toFixed(1)}%`);
      card.style.setProperty("--depth-x", `${(nx * 28).toFixed(2)}px`);
      card.style.setProperty("--depth-y", `${(ny * 24).toFixed(2)}px`);
      stage?.style.setProperty("--scene-x", `${(nx * 26).toFixed(2)}px`);
      stage?.style.setProperty("--scene-y", `${(ny * 20).toFixed(2)}px`);
    };

    card.addEventListener("pointerdown", (event) => {
      if (reducedMotion) return;
      dragging = true;
      moved = false;
      startX = event.clientX;
      startY = event.clientY;
      baseX = rotateX;
      baseY = rotateY;
      card.classList.add("dragging");
      card.setPointerCapture(event.pointerId);
      updateShine(event);
    });

    card.addEventListener("pointermove", (event) => {
      updateShine(event);
      if (!dragging || reducedMotion) return;
      const dx = event.clientX - startX;
      const dy = event.clientY - startY;
      if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
      rotateY = baseY + dx * .65;
      rotateX = baseX - dy * .65;
      applyRotation();
    });

    card.addEventListener("pointerup", (event) => {
      card.classList.remove("dragging");
      if (dragging && !moved && !reducedMotion) {
        card.classList.remove("auto-spin");
        void card.offsetWidth;
        card.classList.add("auto-spin");
        rotateX += 360;
        rotateY += 360;
        window.setTimeout(() => {
          card.classList.remove("auto-spin");
          applyRotation();
        }, 1360);
      }
      dragging = false;
      try { card.releasePointerCapture(event.pointerId); } catch {}
    });

    card.addEventListener("pointercancel", () => {
      dragging = false;
      card.classList.remove("dragging");
    });

    applyRotation();
  </script>
</body>
</html>
